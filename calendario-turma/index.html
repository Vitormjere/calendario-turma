<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendário da Turma · Medicina</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.22/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.22/locales/pt-br.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script>
/* ===== CONFIGURAÇÃO =====
   Cole aqui os dados do seu projeto Supabase (Project Settings > API).
   Se ficar vazio, o site roda em MODO DEMO (dados só no navegador, senha "demo"). */
const SUPABASE_URL = "https://etkcpkzolrtenysjoxam.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_dKmJN0mRg3yeIzCxQRXQ3g_BRP6q5oJ";
const NOME_TURMA = "Medicina · Turma";
const GRUPOS = ["A","B","C","D","E","F","G","H"];
</script>
<style>
:root{
  --bg:#f5f6fa;--card:#fff;--ink:#1b1f2e;--mute:#6a7084;--line:#e3e6ee;
  --aula:#2563eb;--repo:#16a34a;--entrega:#eab308;--prova:#dc2626;--pri:#1b1f2e;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
h1{font-size:17px;margin:0}
h1 small{display:block;font-weight:500;color:var(--mute);font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
button.danger{color:var(--prova);border-color:#f3c5c5}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;background:#e3f6ea;color:var(--repo)}
.demo{font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;background:#fff4cc;color:#8a6a00}
main{max-width:1280px;margin:0 auto;padding:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
.groups{display:flex;gap:5px;flex-wrap:wrap}
.groups button{padding:6px 11px;font-weight:600;font-size:13px;min-width:38px}
.groups button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend .off{opacity:.35;text-decoration:line-through}
#cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.fc{--fc-border-color:var(--line);--fc-today-bg-color:#eef3ff;--fc-button-bg-color:#fff;--fc-button-border-color:var(--line);--fc-button-text-color:var(--ink);--fc-button-hover-bg-color:#f0f2f7;--fc-button-hover-border-color:var(--line);--fc-button-active-bg-color:var(--pri);--fc-button-active-border-color:var(--pri)}
.fc .fc-button-primary:not(:disabled).fc-button-active{color:#fff}
.fc .fc-toolbar-title{font-size:17px;text-transform:capitalize}
.fc .fc-button{font-size:13px;padding:5px 10px;text-transform:capitalize}
.fc-event{cursor:pointer;font-size:12px}
.fc-timegrid-event,.fc-daygrid-block-event{border-width:0 0 0 4px!important;border-radius:6px!important;box-shadow:none!important}
.fc-timegrid-event .fc-event-main{padding:3px 5px;color:#1b1f2e}
.fc-event-title{font-weight:600}
.fc .fc-timegrid-axis-cushion{font-size:11px;color:var(--mute)}
.fc-daygrid-block-event .fc-event-main{padding:2px 5px}
.fc-event-time{color:#5b6176;font-weight:500}
.fc-timegrid-event-harness-inset .fc-timegrid-event{box-shadow:0 0 0 1px #fff!important}
.fc .ev-entrega .fc-event-time{display:none}
.fc-daygrid-dot-event .fc-event-title{font-weight:600}
.fc .fc-timegrid-axis-cushion{font-size:11px;color:var(--mute)}
.fc-daygrid-block-event .fc-event-main{padding:2px 5px}
/* lista (semana no celular) */
.fc .fc-list{border:0}
.fc .fc-list-day-cushion{background:var(--bg);padding:8px 6px;text-transform:capitalize}
.fc .fc-list-day-text{font-weight:700}
.fc-list-event-time,.fc-list-event-graphic{display:none}
.fc .fc-list-event td{border:0}
.fc .fc-list-event-title{padding:4px 2px!important}
.fc .fc-list-event:hover td{background:none}
.lcard{border-left:4px solid;border-radius:8px;padding:8px 10px;line-height:1.4}
.lcard .t{font-weight:600;font-size:14px}
.lcard .m{color:var(--mute);font-size:13px}
.lcard .g{font-size:11.5px;font-weight:600;color:#444a5e;margin-top:2px}
.mchip{border-left:2px solid;border-radius:3px;font-size:10px;font-weight:600;padding:1px 2px;letter-spacing:-.3px;text-align:center;color:#1b1f2e;white-space:nowrap;overflow:hidden}
@media(max-width:700px){
  .fc-dayGridMonth-view .fc-daygrid-event{background:none!important;border:0!important;padding:0!important;margin:1px 1px!important}
  .fc-dayGridMonth-view .fc-daygrid-event-harness{margin:0!important}
  .fc-dayGridMonth-view .fc-daygrid-day-number{font-size:12px}
  .fc .fc-daygrid-more-link{font-size:10.5px}
  header{position:static}
  .fc .fc-toolbar{flex-direction:column;gap:8px}
  #cal{padding:6px}
}
/* modais */
.ov{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
.ov.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:430px;padding:18px;max-height:94vh;overflow:auto}
.modal h2{margin:0 0 12px;font-size:16px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-size:12px;color:var(--mute);font-weight:500}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.types label{border:2px solid var(--line);border-radius:8px;padding:7px 2px;text-align:center;cursor:pointer;font-size:12px;font-weight:600}
.types input{display:none}
.gbox{display:flex;gap:5px;flex-wrap:wrap}
.gbox label{border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer;font-size:12px;display:flex;gap:5px;align-items:center}
.gbox input{width:auto}
.acts{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.err{color:var(--prova);font-size:12px;min-height:16px}
.det p{margin:6px 0}
.det .tag{display:inline-block;color:#fff;font-weight:600;font-size:11px;padding:3px 8px;border-radius:6px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:9px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1}
.hint{font-size:12px;color:var(--mute);margin:8px 2px 0}
</style>
</head>
<body>
<header>
  <h1>📅 Calendário da Turma<small id="turma"></small></h1>
  <div class="row" id="authArea"></div>
</header>

<main>
  <div class="bar">
    <div class="groups" id="groups"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div id="cal"></div>
  <p class="hint" id="hint"></p>
</main>

<!-- login -->
<div class="ov" id="ovLogin">
  <form class="modal" id="fLogin">
    <h2>Entrar como representante</h2>
    <div class="f" id="emailWrap"><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username"></div>
    <div class="f"><label for="lPass">Senha</label><input id="lPass" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lErr"></div>
    <div class="acts"><span></span><div class="row"><button type="button" data-close>Cancelar</button><button class="pri" type="submit">Entrar</button></div></div>
  </form>
</div>

<!-- detalhe (aluno) -->
<div class="ov" id="ovDet"><div class="modal det" id="det"></div></div>

<!-- edição -->
<div class="ov" id="ovEd">
  <form class="modal" id="fEd">
    <h2 id="edTitle">Novo evento</h2>
    <div class="f"><label>Tipo</label><div class="types" id="types"></div></div>
    <div class="f"><label for="eTitulo" id="lblTitulo">Disciplina</label><input id="eTitulo" required></div>
    <div class="f"><label for="eData">Data</label><input id="eData" type="date" required></div>
    <div class="f2" id="horas">
      <div class="f"><label for="eIni" id="lblIni">Início</label><input id="eIni" type="time" required></div>
      <div class="f" id="fimWrap"><label for="eFim">Fim</label><input id="eFim" type="time"></div>
    </div>
    <div class="f"><label for="eLocal">Local</label><input id="eLocal" placeholder="Ex.: Lab. Anatomia"></div>
    <div class="f"><label for="eObs">Observação</label><textarea id="eObs" rows="2" placeholder="Opcional"></textarea></div>
    <div class="f"><label>Grupos</label><div class="gbox" id="gbox"></div></div>
    <div class="f" id="repWrap"><label for="eRep">Repetir toda semana até</label><input id="eRep" type="date"></div>
    <div class="err" id="eErr"></div>
    <div class="acts">
      <button type="button" class="danger" id="btnDel">Excluir</button>
      <div class="row"><button type="button" data-close>Cancelar</button><button class="pri" type="submit">Salvar</button></div>
    </div>
  </form>
</div>
<div class="toast" id="toast"></div>

<script>
const TIPOS={
  aula:{label:'Aula',cor:'var(--aula)',hex:'#2563eb',bg:'#e8f0ff'},
  reposicao:{label:'Reposição',cor:'var(--repo)',hex:'#16a34a',bg:'#e3f6ea'},
  entrega:{label:'Entrega',cor:'var(--entrega)',hex:'#eab308',bg:'#fff5d1'},
  prova:{label:'Prova',cor:'var(--prova)',hex:'#dc2626',bg:'#fdeaea'}
};
const DEMO=!SUPABASE_URL||!SUPABASE_ANON_KEY;
const sb=DEMO?null:supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const isoD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hhmm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000)}

let eventos=[];
let rep=false;
let grupo=store.get('ct_grupo','Todos');
let mostrar=store.get('ct_tipos',{aula:true,reposicao:true,entrega:true,prova:true});

/* ===== DADOS ===== */
function seedDemo(){
  const ev=[];let id=1;
  const seg=new Date();seg.setDate(seg.getDate()-((seg.getDay()+6)%7));seg.setHours(0,0,0,0);
  const at=(w,d,h)=>{const x=new Date(seg);x.setDate(x.getDate()+w*7+d);const[a,b]=h.split(':');x.setHours(+a,+b,0,0);return x.toISOString()};
  const grade=[
    [0,'Anatomia','08:00','10:00','Anfiteatro 1',['Todos']],
    [0,'Lab. Anatomia','10:15','12:00','Lab. Anatomia',['A','B']],
    [0,'Lab. Anatomia','14:00','15:45','Lab. Anatomia',['C','D']],
    [0,'Lab. Anatomia','16:00','17:45','Lab. Anatomia',['E','F']],
    [1,'Fisiologia','08:00','10:00','Sala 204',['Todos']],
    [1,'Histologia (prática)','10:15','12:00','Lab. Micro',['G','H']],
    [1,'Histologia (prática)','14:00','15:45','Lab. Micro',['A','B','C','D']],
    [2,'Bioquímica','08:00','10:00','Sala 204',['Todos']],
    [2,'Lab. Anatomia','10:15','12:00','Lab. Anatomia',['G','H']],
    [2,'Histologia (prática)','14:00','15:45','Lab. Micro',['E','F']],
    [3,'Semiologia','08:00','10:00','Anfiteatro 2',['Todos']],
    [3,'Tutoria PBL','10:15','12:00','Sala 301',['A','C','E','G']],
    [3,'Tutoria PBL','14:00','15:45','Sala 301',['B','D','F','H']],
    [4,'UBS · Estágio','07:30','11:30','UBS Centro',['A','B','C','D']],
    [4,'UBS · Estágio','13:30','17:30','UBS Centro',['E','F','G','H']]
  ];
  for(let w=-4;w<=10;w++)grade.forEach(([d,t,i,f,l,g])=>ev.push({id:id++,tipo:'aula',titulo:t,inicio:at(w,d,i),fim:at(w,d,f),local:l,grupos:g,obs:''}));
  ev.push({id:id++,tipo:'prova',titulo:'Prova de Anatomia',inicio:at(0,2,'14:00'),fim:at(0,2,'16:00'),local:'Anfiteatro 1',grupos:['Todos'],obs:'Conteúdo: membros superiores'});
  ev.push({id:id++,tipo:'prova',titulo:'Prova de Fisiologia',inicio:at(1,4,'14:00'),fim:at(1,4,'16:00'),local:'Sala 204',grupos:['Todos'],obs:''});
  ev.push({id:id++,tipo:'reposicao',titulo:'Reposição Bioquímica',inicio:at(0,5,'09:00'),fim:at(0,5,'11:00'),local:'Sala 204',grupos:['Todos'],obs:'Aula cancelada do dia anterior'});
  ev.push({id:id++,tipo:'reposicao',titulo:'Reposição Lab. Anatomia',inicio:at(1,2,'16:00'),fim:at(1,2,'17:45'),local:'Lab. Anatomia',grupos:['C','D'],obs:''});
  ev.push({id:id++,tipo:'entrega',titulo:'Relatório de Histologia',inicio:at(0,4,'23:59'),fim:null,local:'Pelo AVA',grupos:['Todos'],obs:''});
  ev.push({id:id++,tipo:'entrega',titulo:'Caso clínico PBL',inicio:at(1,1,'12:00'),fim:null,local:'Pelo AVA',grupos:['A','C','E','G'],obs:''});
  return ev;
}
async function carregar(){
  if(DEMO){eventos=store.get('ct_demo',null)||seedDemo();store.set('ct_demo',eventos);return}
  const {data,error}=await sb.from('eventos').select('*').order('inicio');
  if(error){toast('Erro ao carregar: '+error.message);return}
  eventos=data;
}
async function salvarEventos(lista){ // lista de objetos novos ou editados
  if(DEMO){
    lista.forEach(e=>{if(e.id){const i=eventos.findIndex(x=>x.id===e.id);eventos[i]={...eventos[i],...e}}else{e.id=Date.now()+Math.random();eventos.push(e)}});
    store.set('ct_demo',eventos);return true;
  }
  const novos=lista.filter(e=>!e.id),edit=lista.filter(e=>e.id);
  if(novos.length){const {error}=await sb.from('eventos').insert(novos);if(error){toast('Erro: '+error.message);return false}}
  for(const e of edit){const {id,...r}=e;const {error}=await sb.from('eventos').update(r).eq('id',id);if(error){toast('Erro: '+error.message);return false}}
  await carregar();return true;
}
async function excluir(id){
  if(DEMO){eventos=eventos.filter(e=>e.id!==id);store.set('ct_demo',eventos);return true}
  const {error}=await sb.from('eventos').delete().eq('id',id);
  if(error){toast('Erro: '+error.message);return false}
  await carregar();return true;
}

/* ===== LOGIN ===== */
async function checarSessao(){
  if(DEMO){rep=store.get('ct_rep',false);return}
  const {data}=await sb.auth.getSession();rep=!!data.session;
}
function renderAuth(){
  $('authArea').innerHTML=(DEMO?'<span class="demo">Modo demo</span>':'')+
    (rep?'<span class="badge">Representante · editando</span><button id="btnNovo" class="pri">+ Evento</button><button id="btnSair">Sair</button>'
        :'<button id="btnLogin">Sou representante</button>');
  if(rep){$('btnNovo').onclick=()=>abrirEditor(null);$('btnSair').onclick=sair}
  else $('btnLogin').onclick=()=>{$('lErr').textContent='';$('lPass').value='';$('emailWrap').style.display=DEMO?'none':'';abrir('ovLogin');setTimeout(()=>(DEMO?$('lPass'):$('lEmail')).focus(),50)};
  $('hint').textContent=rep?'Clique num horário vazio para criar. Clique num evento para editar. Arraste para mudar de horário.':'Escolha seu grupo lá em cima. Clique num evento para ver detalhes.';
}
$('fLogin').onsubmit=async e=>{
  e.preventDefault();
  if(DEMO){if($('lPass').value!=='demo'){$('lErr').textContent='Senha incorreta (no modo demo é "demo").';return}rep=true;store.set('ct_rep',true)}
  else{const {error}=await sb.auth.signInWithPassword({email:$('lEmail').value.trim(),password:$('lPass').value});if(error){$('lErr').textContent='E-mail ou senha inválidos.';return}rep=true}
  fechar();renderAuth();atualizar();toast('Modo edição ativado');
};
async function sair(){if(DEMO)store.set('ct_rep',false);else await sb.auth.signOut();rep=false;renderAuth();atualizar();toast('Saiu do modo edição')}

/* ===== FILTROS ===== */
function renderFiltros(){
  $('groups').innerHTML=['Todos',...GRUPOS].map(g=>`<button data-g="${g}" class="${g===grupo?'on':''}">${g==='Todos'?'Turma toda':g}</button>`).join('');
  $('legend').innerHTML=Object.entries(TIPOS).map(([k,t])=>`<span data-t="${k}" class="${mostrar[k]?'':'off'}"><i style="background:${t.cor}"></i>${t.label}</span>`).join('');
}
$('groups').onclick=e=>{const b=e.target.closest('button');if(!b)return;grupo=b.dataset.g;store.set('ct_grupo',grupo);renderFiltros();atualizar()};
$('legend').onclick=e=>{const s=e.target.closest('span');if(!s)return;mostrar[s.dataset.t]=!mostrar[s.dataset.t];store.set('ct_tipos',mostrar);renderFiltros();atualizar()};
const visivel=e=>mostrar[e.tipo]&&(grupo==='Todos'||e.grupos.includes('Todos')||e.grupos.includes(grupo));

/* ===== CALENDÁRIO ===== */
const mobile=window.innerWidth<700;
const cal=new FullCalendar.Calendar($('cal'),{
  locale:'pt-br',firstDay:1,
  initialView:mobile?'listWeek':'timeGridWeek',
  views:{listWeek:{buttonText:mobile?'Semana':'Lista'},listDay:{buttonText:'Dia',noEventsContent:'Nenhum evento neste dia'}},
  listDayFormat:{weekday:'long',day:'2-digit',month:'2-digit'},listDaySideFormat:false,
  noEventsContent:'Nenhum evento nesta semana',navLinks:true,navLinkDayClick:mobile?'listDay':'timeGridDay',
  headerToolbar:mobile?{left:'prev,next today',center:'title',right:'dayGridMonth,listWeek,listDay'}:{left:'prev,next today',center:'title',right:'dayGridMonth,timeGridWeek,timeGridDay,listWeek'},
  buttonText:{today:'Hoje',month:'Mês',week:'Semana',day:'Dia'},
  slotMinTime:'07:00:00',slotMaxTime:'24:00:00',scrollTime:'07:00:00',
  allDaySlot:true,allDayText:'Prazos',slotEventOverlap:false,nowIndicator:true,height:'auto',expandRows:true,
  dayMaxEvents:mobile?3:4,moreLinkText:n=>'+'+n,eventDisplay:'block',
  slotLabelFormat:{hour:'2-digit',minute:'2-digit',hour12:false},
  eventTimeFormat:{hour:'2-digit',minute:'2-digit',hour12:false},
  events:(info,ok)=>ok(eventos.filter(visivel).map(e=>{
    const t=TIPOS[e.tipo];
    let fim=e.fim;
    let ini=e.inicio,allDay=false;
    if(e.tipo==='entrega'){ini=isoD(new Date(e.inicio));fim=null;allDay=true}
    const pre=e.tipo==='entrega'?'📄 até '+hhmm(new Date(e.inicio))+' · ':e.tipo==='prova'?'📝 ':e.tipo==='reposicao'?'🔁 ':'';
    const g=e.grupos.includes('Todos')?'':' ['+e.grupos.join(',')+']';
    return {id:String(e.id),title:pre+e.titulo+g,start:ini,end:fim,allDay,backgroundColor:t.bg,borderColor:t.hex,textColor:'#1b1f2e',classNames:['ev-'+e.tipo],extendedProps:{raw:e,pre,g}};
  })),
  eventContent:a=>{
    const e=a.event.extendedProps.raw,t=TIPOS[e.tipo],ini=new Date(e.inicio);
    const hora=e.tipo==='entrega'?'até '+hhmm(ini):hhmm(ini)+'–'+hhmm(new Date(e.fim));
    if(a.view.type.startsWith('list')){
      const g=e.grupos.includes('Todos')?'Turma toda':'Grupos '+e.grupos.join(', ');
      return {html:`<div class="lcard" style="background:${t.bg};border-color:${t.hex}"><div class="t">${e.tipo!=='aula'&&!e.titulo.toLowerCase().startsWith(t.label.toLowerCase())?t.label+' · ':''}${esc(e.titulo)}</div><div class="m">${hora}${e.local?' · '+esc(e.local):''}</div><div class="g">${g}</div></div>`};
    }
    if(mobile&&a.view.type==='dayGridMonth')
      return {html:`<div class="mchip" style="background:${t.bg};border-color:${t.hex}">${hhmm(ini)}</div>`};
    return true;
  },
  editable:false,selectable:false,
  eventClick:i=>{const e=i.event.extendedProps.raw;rep?abrirEditor(e):detalhe(e)},
  select:i=>{if(rep)abrirEditor(null,i.start,i.end);cal.unselect()},
  dateClick:i=>{if(rep&&i.view.type==='dayGridMonth'){const d=new Date(i.date);d.setHours(8);abrirEditor(null,d)}},
  eventDrop:mover,eventResize:mover
});
async function mover(i){
  const e=i.event.extendedProps.raw;
  let nIni=i.event.start;
  if(e.tipo==='entrega'){const o=new Date(e.inicio);nIni=new Date(nIni);nIni.setHours(o.getHours(),o.getMinutes(),0,0)}
  const upd={id:e.id,inicio:nIni.toISOString(),fim:e.tipo==='entrega'?null:(i.event.end?i.event.end.toISOString():e.fim)};
  if(await salvarEventos([upd])){toast('Horário atualizado');atualizar()}else i.revert();
}
function atualizar(){cal.setOption('editable',rep);cal.setOption('selectable',rep);cal.refetchEvents()}

/* ===== DETALHE ===== */
function detalhe(e){
  const t=TIPOS[e.tipo],ini=new Date(e.inicio);
  const quando=e.tipo==='entrega'?'Prazo: '+ini.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'})+' até '+hhmm(ini)
    :ini.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'})+' · '+hhmm(ini)+(e.fim?'–'+hhmm(new Date(e.fim)):'');
  $('det').innerHTML=`<span class="tag" style="background:${t.hex};${e.tipo==='entrega'?'color:#3d2f00':''}">${t.label}</span>
    <h2 style="margin-top:10px">${esc(e.titulo)}</h2>
    <p>🕒 ${esc(quando)}</p>${e.local?`<p>📍 ${esc(e.local)}</p>`:''}
    <p>👥 ${e.grupos.includes('Todos')?'Turma toda':'Grupos '+e.grupos.join(', ')}</p>
    ${e.obs?`<p>💬 ${esc(e.obs)}</p>`:''}
    <div class="acts"><span></span><button data-close>Fechar</button></div>`;
  abrir('ovDet');
}

/* ===== EDITOR ===== */
let editando=null;
function setTipo(k){
  $('types').querySelectorAll('label').forEach(l=>{const on=l.dataset.k===k;l.querySelector('input').checked=on;const h=TIPOS[l.dataset.k].hex;l.style.borderColor=on?h:'';l.style.background=on?h+'22':''});
  const ent=k==='entrega';
  $('fimWrap').style.display=ent?'none':'';$('eFim').required=!ent;
  $('lblIni').textContent=ent?'Entregar até':'Início';
  $('lblTitulo').textContent=ent?'Trabalho':k==='prova'?'Prova de':'Disciplina';
  $('repWrap').style.display=(!editando&&k==='aula')?'':'none';
}
function abrirEditor(e,ini,fim){
  editando=e;
  $('edTitle').textContent=e?'Editar evento':'Novo evento';
  $('btnDel').style.visibility=e?'visible':'hidden';$('btnDel').dataset.c='';$('btnDel').textContent='Excluir';
  $('types').innerHTML=Object.entries(TIPOS).map(([k,t])=>`<label data-k="${k}"><input type="radio" name="tipo" value="${k}">${t.label}</label>`).join('');
  const s=e?new Date(e.inicio):(ini||(()=>{const d=new Date();d.setHours(8,0,0,0);return d})());
  const f=e?(e.fim?new Date(e.fim):null):(fim||new Date(s.getTime()+2*3600000));
  $('eTitulo').value=e?e.titulo:'';$('eData').value=isoD(s);$('eIni').value=hhmm(s);$('eFim').value=f?hhmm(f):'';
  $('eLocal').value=e?e.local||'':'';$('eObs').value=e?e.obs||'':'';$('eRep').value='';
  const gs=e?e.grupos:(grupo==='Todos'?['Todos']:[grupo]);
  $('gbox').innerHTML=['Todos',...GRUPOS].map(g=>`<label><input type="checkbox" value="${g}" ${gs.includes(g)?'checked':''}>${g==='Todos'?'Turma toda':g}</label>`).join('');
  $('eErr').textContent='';
  setTipo(e?e.tipo:'aula');
  abrir('ovEd');
}
$('types').onclick=e=>{const l=e.target.closest('label');if(l){e.preventDefault();setTipo(l.dataset.k)}};
$('gbox').onchange=e=>{const bx=[...$('gbox').querySelectorAll('input')];if(e.target.checked){if(e.target.value==='Todos')bx.slice(1).forEach(b=>b.checked=false);else bx[0].checked=false}};
$('fEd').onsubmit=async ev=>{
  ev.preventDefault();
  const tipo=$('fEd').tipo.value;
  const grupos=[...$('gbox').querySelectorAll('input:checked')].map(b=>b.value);
  if(!grupos.length){$('eErr').textContent='Escolha pelo menos um grupo.';return}
  const mk=(data,h)=>{const[y,m,d]=data.split('-').map(Number);const[a,b]=h.split(':').map(Number);return new Date(y,m-1,d,a,b)};
  const ini=mk($('eData').value,$('eIni').value);
  const fim=tipo==='entrega'?null:mk($('eData').value,$('eFim').value);
  if(fim&&fim<=ini){$('eErr').textContent='O fim precisa ser depois do início.';return}
  const base={tipo,titulo:$('eTitulo').value.trim(),local:$('eLocal').value.trim(),obs:$('eObs').value.trim(),grupos};
  let lista=[];
  if(editando)lista=[{id:editando.id,...base,inicio:ini.toISOString(),fim:fim?fim.toISOString():null}];
  else{
    const ate=$('eRep').value&&tipo==='aula'?mk($('eRep').value,'23:59'):ini;
    for(let i=new Date(ini),f=fim?new Date(fim):null,n=0;i<=ate&&n<60;n++){
      lista.push({...base,inicio:i.toISOString(),fim:f?f.toISOString():null});
      i=new Date(i.getTime()+7*864e5);if(f)f=new Date(f.getTime()+7*864e5);
    }
  }
  if(await salvarEventos(lista)){fechar();atualizar();cal.gotoDate(ini);toast(lista.length>1?lista.length+' aulas criadas':'Evento salvo')}
};
$('btnDel').onclick=async()=>{
  const b=$('btnDel');if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Confirmar exclusão';return}
  if(await excluir(editando.id)){fechar();atualizar();toast('Evento excluído')}
};

/* ===== MODAIS ===== */
function abrir(id){$(id).classList.add('show')}
function fechar(){document.querySelectorAll('.ov').forEach(o=>o.classList.remove('show'));editando=null}
document.addEventListener('click',e=>{if(e.target.matches('[data-close]')||e.target.classList.contains('ov'))fechar()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});

/* ===== INÍCIO ===== */
(async()=>{
  $('turma').textContent=NOME_TURMA;
  await checarSessao();await carregar();
  renderFiltros();renderAuth();cal.render();atualizar();
  if(!DEMO){
    sb.channel('ev').on('postgres_changes',{event:'*',schema:'public',table:'eventos'},async()=>{await carregar();cal.refetchEvents()}).subscribe();
  }
})();
</script>
